<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17202c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 8px #0009}.top{display:flex;justify-content:space-between;padding:clamp(12px,3vw,25px);gap:8px}.brand{font-size:clamp(16px,3vw,25px);font-weight:1000;letter-spacing:.1em}.brand span{color:#ffe05d}.pill{background:#111b2bc9;border:1px solid #ffffff45;border-radius:13px;padding:8px 12px;font-size:clamp(11px,2vw,14px);font-weight:800;backdrop-filter:blur(8px)}#stats{display:flex;gap:8px}#levelTag{position:absolute;top:75px;left:50%;transform:translateX(-50%);white-space:nowrap}#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(90vw,460px);text-align:center;pointer-events:auto}.panel{padding:clamp(20px,5vw,34px);border-radius:25px;border:1px solid #ffffff40;background:linear-gradient(145deg,#1b2942ed,#101827ed);box-shadow:0 25px 90px #0009}h1{font-size:clamp(34px,8vw,58px);line-height:.92;letter-spacing:-.05em;margin:0}.sub{color:#d4deef;line-height:1.5;margin:15px 0 20px;font-size:clamp(13px,3vw,16px)}button{border:0;border-radius:14px;padding:14px 21px;font:900 15px system-ui;background:#ffe05d;color:#172035;box-shadow:0 5px 0 #bd9225;touch-action:manipulation;cursor:pointer}.secondary{background:#34445f;color:white;box-shadow:0 5px 0 #202b40;margin-left:8px}.hidden{display:none!important}#bottomHint{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px}#touch{position:absolute;bottom:22px;left:0;right:0;display:none;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.group{display:flex;gap:10px;pointer-events:auto}.touchBtn{width:60px;height:60px;border-radius:50%;padding:0;background:#111b2bc9;border:2px solid #ffffff80;color:white;font-size:24px;box-shadow:0 4px 0 #0005}.jump{width:76px;height:76px;background:#ffe05ded;color:#172035}@media(pointer:coarse){#touch{display:flex}#bottomHint{bottom:112px}}@media(max-height:500px){#center{top:50%}.panel{padding:14px}h1{font-size:34px}.sub{margin:8px 0 12px}.touchBtn{width:48px;height:48px}.jump{width:60px;height:60px}}

</head><body>
<div id="hud"><div class="top"><div class="brand">SLIDE <span>RUSH 3D</span></div><div id="stats"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">BEST <b id="best">0</b></div></div></div><div id="levelTag" class="pill hidden">LEVEL 1 · KITCHEN CHAOS</div>
<div id="center"><div class="panel" id="menu"><h1>SLIDE<br><span style="color:#ffe05d">RUSH 3D</span></h1><div class="sub">Race through a giant kitchen, dodge oversized obstacles, hit the ramps and catch some air!</div><button id="play">PLAY NOW ▶</button><div class="sub" style="font-size:12px;margin-bottom:0">PC: ← → / A D to steer · SPACE / ↑ to jump<br>Phone & tablet: swipe or use the buttons</div></div><div class="panel hidden" id="end"><h1 id="endTitle">WIPEOUT!</h1><div class="sub" id="endText"></div><button id="retry">TRY AGAIN ↻</button><button class="secondary" id="next">NEXT LEVEL →</button></div></div>
<div id="bottomHint">DODGE · JUMP · HIT THE RAMPS</div><div id="touch"><div class="group"><button class="touchBtn" id="left">◀</button><button class="touchBtn" id="right">▶</button></div><button class="touchBtn jump" id="jump">⬆</button></div></div>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8b98a');scene.fog=new THREE.Fog('#e8b98a',23,75);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(0,5.2,10.5);
scene.add(new THREE.HemisphereLight(0xeaf5ff,0x806044,2.0));const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-5,12,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-13;sun.shadow.camera.right=13;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;scene.add(sun);
const mat=(color,rough=.72,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const M={wood:mat('#a96b3c'),wood2:mat('#d39a61'),cream:mat('#f0dfc6'),tile:mat('#e8dfd2'),dark:mat('#34404b'),steel:mat('#aebbc3',.28,.72),blue:mat('#168de0',.3),blue2:mat('#48c0ff',.3),white:mat('#fff9ed',.3),red:mat('#df4d45',.3),yellow:mat('#ffd34f',.35),green:mat('#56a66a'),black:mat('#18212a',.4),glass: new THREE.MeshStandardMaterial({color:'#9dd9e8',roughness:.12,metalness:.25,transparent:true,opacity:.7})};
const boxGeo=new THREE.BoxGeometry(1,1,1);function box(parent,name,x,y,z,sx,sy,sz,material,shadow=true){const o=new THREE.Mesh(boxGeo,material);o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=shadow;o.receiveShadow=true;parent.add(o);return o}
function sphere(parent,x,y,z,sx,sy,sz,material){const o=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o}
function cyl(parent,x,y,z,r1,r2,h,material,seg=24){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function group(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g}
const world=group(scene);let player,board,body,head,arms=[],legs=[],level=1,score=0,best=+(localStorage.getItem('sliderush3dBest')||0),state='menu',lane=1,targetX=0,jumpY=0,jumpV=0,speed=10,travel=0,spawnTimer=1.3,objects=[],decor=[],last=0,runTime=0,shake=0;
$('best').textContent=best;
function makeCharacter(){arms.length=0;legs.length=0;player=group(world,0,.42,3.1);board=group(player);box(board,'blue sled',0,0,0,1.05,.18,1.55,M.blue);box(board,'sled nose',0,.1,-.48,.78,.12,.35,M.blue2);for(const x of [-.42,.42]){cyl(board,x,-.1,.48,.11,.11,.13,M.steel);const wheel= new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.12,18),M.black);wheel.rotation.z=Math.PI/2;wheel.position.set(x,-.11,.48);board.add(wheel)}
body=group(board,0,.42,.05);sphere(body,0,.38,0,.38,.48,.3,M.blue2);head=group(body,0,.9,-.03);sphere(head,0,0,0,.34,.34,.32,M.blue);sphere(head,-.13,.03,-.27,.07,.075,.045,M.white);sphere(head,.13,.03,-.27,.07,.075,.045,M.white);sphere(head,-.13,.03,-.31,.032,.04,.02,M.black);sphere(head,.13,.03,-.31,.032,.04,.02,M.black);sphere(head,0,-.12,-.3,.09,.035,.025,M.black);
for(const x of [-.43,.43]){const a=group(body,x,.55,0);const arm=sphere(a,0,-.2,0,.13,.29,.14,M.blue);arm.rotation.z=x<0?-.45:.45;arms.push(a)}for(const x of [-.2,.2]){const l=group(body,x,.05,.02);sphere(l,0,-.16,0,.15,.27,.16,M.blue);legs.push(l)} }
function clearWorld(){while(world.children.length)world.remove(world.children[0]);objects=[];decor=[]}
function kitchen(){// tiled floor, cabinets, counters and appliances around the sliding lane
box(world,'kitchen floor',0,-.32,-24,13,.35,65,M.tile);for(let x=-6;x<=6;x+=2){for(let z=-55;z<8;z+=2){const line=box(world,'floor grout',x,-.137,z,.018,.006,1.98,mat('#c9beb0'));line.castShadow=false}}
for(const side of [-1,1]){box(world,'wall',side*6.1,3,-25,.35,6.5,65,M.cream);for(let z=-3;z>-54;z-=5){const base=box(world,'lower cabinet',side*5.25,1.05,z,1.25,1.8,4.5,M.wood);box(world,'countertop',side*5.15,2.02,z,1.65,.16,4.8,M.steel);box(world,'upper cabinet',side*5.25,4.25,z,1.2,1.65,3.6,M.cream);for(let k=-1;k<=1;k++){box(world,'cabinet door',side*5.25,4.25,z+k*.95,1.23,1.48,.035,M.wood2);cyl(world,side*4.62,4.23,z+k*.95,.045,.045,.08,M.steel)}}}
// refrigerator at the back-left and oven/stove on right
box(world,'fridge body',-5.15,2.35,-13,1.35,4.7,1.6,M.steel);box(world,'fridge freezer seam',-4.45,2.35,-13,.035,4.35,.035,M.dark);box(world,'fridge handle',-4.42,2.5,-12.5,.06,1.05,.07,M.white);
box(world,'oven',5.1,1.1,-19,1.35,1.75,1.5,M.dark);box(world,'oven glass',5.1,1.05,-18.22,1.05,.85,.06,M.glass);box(world,'stove top',5.1,2.03,-19,1.65,.12,1.8,M.steel);for(let x of [-.45,.45])for(let z of [-.55,.45])cyl(world,5.1+x,2.12,-19+z,.22,.22,.06,M.black);
// sink and faucet
box(world,'sink rim',-5.1,2.13,-26,1.25,.1,1.45,M.steel);box(world,'sink basin',-5.1,2.17,-26,.85,.05,1.02,M.dark);const tap=cyl(world,-5.1,2.42,-26.5,.045,.045,.52,M.steel);box(world,'tap spout',-5.1,2.67,-26.25,.08,.08,.5,M.steel);
// ceiling beams and warm hanging lights
for(let z=-5;z>-55;z-=10){box(world,'ceiling beam',0,6.15,z,12.2,.22,.3,M.wood);const lamp=group(world,0,5.85,z);cyl(lamp,0,-.25,0,.045,.045,.5,M.dark);cyl(lamp,0,-.55,0,.38,.22,.28,M.yellow);const light=new THREE.PointLight(0xffd69a,35,13,2);light.position.set(0,-.65,0);lamp.add(light)}
// backsplash wall tile panels
for(const side of [-1,1])for(let z=-5;z>-53;z-=1.1)box(world,'backsplash tile',side*5.87,2.75,z,.04,.55,1.02,mat((Math.floor(-z)%2)?'#d8c8b5':'#eee4d7'));
}
function bathroom(){box(world,'bath floor',0,-.32,-24,13,.35,65,mat('#cbdce0'));for(const s of [-1,1]){box(world,'bath wall',s*6.1,3,-24,.35,6.5,65,mat('#dcecf0'));for(let z=-6;z>-55;z-=3){box(world,'blue tile',s*5.88,3,z,.04,2.8,2.8,mat('#b2d5df'))}}box(world,'bathtub',-5,1,-14,2,1.8,4.5,M.white);box(world,'tub rim',-5,1.95,-14,2.2,.18,4.7,M.steel);box(world,'vanity',5,1,-22,1.6,1.8,2.5,M.wood);box(world,'vanity top',5,2,-22,1.9,.18,2.8,M.white);cyl(world,5,2.15,-22,.42,.42,.1,M.steel);}
function valley(){box(world,'trail',0,-.32,-24,13,.35,65,mat('#bd7a42'));for(const s of [-1,1])for(let z=-4;z>-55;z-=4){const tree=group(world,s*(5.2+Math.random()),0,z);cyl(tree,0,1.3,0,.22,.3,2.6,M.wood);const crown=sphere(tree,0,3,0,1.2,1.4,1.2,mat(Math.random()>.5?'#c75e32':'#d78b3d'));} }
function buildLevel(){clearWorld();if(level===0)kitchen();else if(level===1)bathroom();else valley();makeCharacter();scene.background=new THREE.Color(level===1?'#e9c49a':level===0?'#a9dced':'#f0b18b');scene.fog.color.copy(scene.background);}
function makeCup(parent,x,y,z,scale=1){const g=group(parent,x,y,z);cyl(g,0,.42*scale,0,.35*scale,.25*scale,.84*scale,M.red);cyl(g,0,.86*scale,0,.36*scale,.36*scale,.08*scale,M.white);cyl(g,0,.9*scale,0,.27*scale,.27*scale,.025*scale,M.yellow);return g}
function obstacle(type,laneIndex,z){const x=(laneIndex-1)*2.15,g=group(world,x,0,z);g.userData={type,lane:laneIndex,hit:false};if(type==='cup'){makeCup(g,0,0,0,1.2)}else if(type==='crate'){box(g,'wooden crate',0,.65,0,1.45,1.3,1.35,M.wood);for(let i=-1;i<=1;i++)box(g,'crate slat',i*.42,.65,.69,.12,1.22,.035,M.wood2);box(g,'crate brace',0,.65,.72,1.4,.12,.06,M.wood2)}else if(type==='pan'){cyl(g,0,.22,0,.78,.78,.3,M.dark);const h=cyl(g,0,.22,.85,.1,.1,1.45,M.steel);h.rotation.x=Math.PI/2}else if(type==='tomato'){sphere(g,0,.58,0,.62,.58,.62,M.red);cyl(g,0,1.18,0,.09,.03,.25,M.green)}else if(type==='sponge'){box(g,'sponge',0,.25,0,1.45,.5,1.1,M.yellow);for(let i=0;i<18;i++)sphere(g,(Math.random()-.5)*1.2,.53,(Math.random()-.5)*.85,.035,.025,.035,M.wood2)}else{box(g,'soap bottle',0,.62,0,.8,1.2,.65,M.blue2);cyl(g,0,1.3,0,.13,.13,.28,M.white)}objects.push(g);return g}
function ramp(laneIndex,z){const x=(laneIndex-1)*2.15,g=group(world,x,0,z);const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.9,.35,2.5),M.yellow);mesh.position.set(0,.25,0);mesh.rotation.x=-.23;mesh.castShadow=true;mesh.receiveShadow=true;g.add(mesh);for(let i=-1;i<=1;i++){const stripe=box(g,'ramp stripe',i*.48,.45,-.18,.12,.035,1.7,M.white);stripe.rotation.x=-.23}g.userData={type:'ramp',lane:laneIndex,hit:false};objects.push(g)}
function reset(){score=0;speed=10;travel=0;spawnTimer=1.1;lane=1;targetX=0;jumpY=0;jumpV=0;runTime=0;shake=0;objects.forEach(o=>world.remove(o));objects=[];$('score').textContent='0';$('levelTag').textContent=`LEVEL ${level+1} · ${['KITCHEN CHAOS','BATHROOM BLITZ','AUTUMN VALLEY'][level]}`;$('levelTag').classList.remove('hidden');$('center').classList.add('hidden');state='playing';buildLevel();}
function start(){reset();last=performance.now();requestAnimationFrame(loop)}function end(win=false){state='end';if(score>best){best=score;localStorage.setItem('sliderush3dBest',best);$('best').textContent=best}$('endTitle').textContent=win?'LEVEL CLEAR!':'WIPEOUT!';$('endText').textContent=win?`You cleared the ${['Kitchen Chaos','Bathroom Blitz','Autumn Valley'][level]}! Score: ${score}`:`Score: ${score}. Try again and time your jumps!`;$('next').classList.toggle('hidden',level===2);$('center').classList.remove('hidden');$('menu').classList.add('hidden');$('end').classList.remove('hidden')}
function move(d){if(state!=='playing')return;lane=Math.max(0,Math.min(2,lane+d));targetX=(lane-1)*2.15}function jump(){if(state==='playing'&&jumpY<=.03)jumpV=8.5}
$('play').onclick=()=>{level=0;$('menu').classList.remove('hidden');$('end').classList.add('hidden');start()};$('retry').onclick=()=>{$('end').classList.add('hidden');start()};$('next').onclick=()=>{level=Math.min(2,level+1);$('end').classList.add('hidden');start()};$('left').onpointerdown=e=>{e.preventDefault();move(-1)};$('right').onpointerdown=e=>{e.preventDefault();move(1)};$('jump').onpointerdown=e=>{e.preventDefault();jump()};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','A','d','D'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if(e.key===' '||e.key==='ArrowUp')jump();if(state==='menu'&&e.key==='Enter')start()});let touch=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touch={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!touch||state!=='playing')return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-20)jump();touch=null});
function update(dt){if(state!=='playing')return;runTime+=dt;travel+=speed*dt;score+=Math.floor(dt*25);$('score').textContent=score;speed=Math.min(17,speed+dt*.12);player.position.x+=(targetX-player.position.x)*Math.min(1,dt*10);player.position.y=.42+jumpY; if(jumpY>0||jumpV>0){jumpY+=jumpV*dt;jumpV-=22*dt;if(jumpY<0){jumpY=0;jumpV=0}}const lean=(targetX-player.position.x);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-lean*.11,dt*8);body.rotation.x=Math.sin(runTime*12)*.07+(jumpY>0?-.25:0);body.rotation.z=Math.sin(runTime*9)*.045;arms.forEach((a,i)=>{a.rotation.z=(i===0?-.3:.3)+Math.sin(runTime*13+i)*.12});legs.forEach((l,i)=>{l.rotation.x=Math.sin(runTime*14+i*Math.PI)*.18});board.rotation.x=jumpY>0?-.12:Math.sin(runTime*14)*.025;
spawnTimer-=dt;if(spawnTimer<=0){const laneIndex=Math.floor(Math.random()*3);if(Math.random()<.24)ramp(laneIndex,-48);else obstacle(['cup','crate','pan','tomato','sponge','soap'][Math.floor(Math.random()*6)],laneIndex,-48);spawnTimer=Math.max(.72,1.45-(speed-10)*.055)+Math.random()*.45}
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.position.z+=speed*dt;if(!o.userData.hit&&o.position.z>2.65&&o.position.z<4.05&&o.userData.lane===lane){o.userData.hit=true;if(o.userData.type==='ramp'){if(jumpY<.5)jumpV=Math.max(jumpV,10.5)}else if(jumpY<.65){shake=.28;end(false);return}else score+=30}if(o.position.z>8){world.remove(o);objects.splice(i,1)}}
// Scroll floor details for continuous motion
for(const child of world.children){if(child.name==='floor grout'){child.position.z+=speed*dt;if(child.position.z>5)child.position.z-=60}}
if(travel>510){end(true);return}if(shake>0)shake-=dt}
function animateCamera(dt){camera.position.x+=(player.position.x*.28-camera.position.x)*dt*3;camera.position.y+=(5.3+jumpY*.18-camera.position.y)*dt*3;camera.position.z=10.5;camera.lookAt(player.position.x*.2,1.15,-5)}
function loop(now){const dt=Math.min((now-last)/1000,.035);last=now;update(dt);if(state==='playing')animateCamera(dt);if(shake>0){camera.position.x+=(Math.random()-.5)*shake*.3;camera.position.y+=(Math.random()-.5)*shake*.3}renderer.render(scene,camera);if(state==='playing')requestAnimationFrame(loop)}
function idle(t){if(state!=='playing'){if(player){player.position.y=.42+Math.sin(t*.002)*.045;body.rotation.z=Math.sin(t*.0015)*.035;camera.lookAt(0,1,-5)}renderer.render(scene,camera);requestAnimationFrame(idle)}}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))}addEventListener('resize',onResize);
buildLevel();$('menu').classList.remove('hidden');$('end').classList.add('hidden');requestAnimationFrame(idle);
</script></body></html>
